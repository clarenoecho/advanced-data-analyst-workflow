# ============================================================================
# state.yaml : SUMBER KEBENARAN PROGRES (Dapur Data: Advanced Data Analyst)
# ============================================================================
# Aturan:
#  - File ini hanya diubah lewat tools/progress.py (atau oleh Tasya secara sadar).
#  - Mentor AI TIDAK PERNAH mengubah file ini. Mentor hanya mengusulkan
#    Evidence Entry (lihat system/03_rubrik_validasi.md bagian 7).
#  - Jika ingatan mentor berbeda dengan file ini, yang berlaku adalah file ini.
#  - Urutan modul dalam daftar = urutan roadmap (system/02_roadmap.md).
#
# Nilai status yang sah:
#   belum      : belum dimulai (terkunci bila bukan resep aktif)
#   aktif      : resep (quest) yang sedang dikerjakan; hanya boleh satu
#   learned    : materi dipelajari, belum lulus ujian
#   validated  : lulus ujian validasi, bukti lengkap
#   retained   : lulus retrieval review setelah jeda >= 7 hari
#   mastered   : terbukti dipakai mandiri di >= 2 konteks
#
# Modul yang punya daftar `quest` tidak menyimpan status sendiri; statusnya
# diturunkan dari quest-nya. Tipe: materi (default) | portfolio | capstone.
# Modul `opsional: true` tidak menghalangi portfolio dan boleh dilewati.
# Portfolio sebuah fase terbuka bila semua modul non-opsional di fase itu selesai.
#
# Bidang opsional per item: tanggal_validasi, evidence (daftar id di
# state/evidence/), review_berikutnya (YYYY-MM-DD), perlu_review (true/false),
# catatan.
# ============================================================================

